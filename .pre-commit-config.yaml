# Local, check-only gates. Install pre-commit, Gitleaks, Semgrep, Foundry,
# and ripgrep on developer machines. Full builds, tests, fork tests, license
# review, and release-manifest approval remain separate publication gates.
minimum_pre_commit_version: '3.2.0'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key

  # The system hook uses the installed Gitleaks binary and scans only the
  # staged diff. It redacts findings; never add --no-redact here.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        name: gitleaks (staged diff, redacted)
        pass_filenames: false
        always_run: true

  - repo: local
    hooks:
      - id: public-migration-scope
        name: public migration scope (staged paths and local references)
        entry: bash script/hooks/check-public-scope.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: bash-syntax
        name: bash syntax (scripts)
        entry: bash script/hooks/check-bash-syntax.sh
        language: system
        files: ^script/.*\.sh$
      # The audit-response register is data the launch verification pass and C8-14 both read, so a
      # half-filled record has to be refused at commit time rather than discovered later. Green on
      # the empty register it ships as ("0 findings registered"), so this costs nothing until the
      # audit starts.
      - id: audit-response
        name: audit response register (docs/audit-findings-v8.json)
        entry: bash script/v2/check-audit-response.sh
        language: system
        pass_filenames: false
        files: ^(docs/audit-findings-v8\.json|script/v2/check-audit-response\.sh)$
      # Checked-in, offline rules keep commit-time scans quick. Run the
      # broader Semgrep and Slither rulesets in CI/release review.
      - id: semgrep-v2
        name: semgrep (v2 source safety)
        entry: semgrep scan --config .semgrep/solidity.yml --error --quiet --disable-version-check
        language: system
        files: ^src/v2/.*\.sol$
      - id: forge-fmt-v2
        name: forge fmt --check (v2 Solidity)
        entry: forge fmt --check
        language: system
        files: ^(src/v2|script/v2|test/v2)/.*\.sol$
