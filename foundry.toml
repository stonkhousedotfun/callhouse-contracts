[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
ffi = false
fs_permissions = [{ access = "read", path = "./out" }, { access = "read", path = "../ops" }]
no_match_path = "test/fork/*"

[profile.fork]
no_match_path = ""
match_path = "test/fork/*"

[profile.ci]
verbosity = 3
no_match_path = "test/fork/*"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
rh = "${RH_RPC}"
rh_testnet = "${RH_RPC_TESTNET}"

[etherscan]
rh = { key = "${EXPLORER_API_KEY}", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }
