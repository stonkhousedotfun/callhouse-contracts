name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source:
    name: secret and v2 source checks
    runs-on: ubuntu-latest
    steps:
      # Deliberately do not populate vendored git submodules in this job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          submodules: false
      - name: Gitleaks (checked-out source, redacted)
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/src:ro" --workdir /src \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir --redact --no-banner --log-level warn .
      - name: Semgrep (checked-in v2 Solidity rules)
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/src:ro" --workdir /src \
            semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b \
            semgrep scan --config .semgrep/solidity.yml --error --quiet \
              --disable-version-check --metrics=off src/v2
